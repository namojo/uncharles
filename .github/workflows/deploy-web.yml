name: Deploy Web Build

# Builds the Godot web export from export_presets.cfg ("Web" preset) and
# publishes it to GitHub Pages: https://namojo.github.io/uncharles/
# The preset is single-threaded, so Pages needs no COOP/COEP headers.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Must match the editor the project is pinned to (docs/engine-reference/godot/VERSION.md).
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # The templates archive is about 1.2 GB; only the single-threaded web
      # templates are kept, and cached per Godot version.
      - name: Cache Godot and web templates
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot and web templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/godot" "$templates"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$templates"
          rm godot.zip templates.tpz

      - name: Export
        run: |
          godot="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --path . --import
          mkdir -p build/web
          "$godot" --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm && test -s build/web/index.pck

      # The making-of page (static, built by tools/making/) is served at /making/.
      - name: Add making-of page
        run: |
          cp -r site/making build/web/making
          test -s build/web/making/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
